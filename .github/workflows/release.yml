name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewer: a pushed tag waits for the maintainer's approval before anything runs.
    # The trusted publisher on npmjs.com names this environment, so no other job can publish.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No registry-url: setup-node would then set NODE_AUTH_TOKEN, and npm would try that token
      # instead of the OIDC exchange.
      - name: npm 11.5.1 or later for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Tarball holds only dist/ and package docs
        run: pnpm check:pack
      - run: npm publish --provenance --access public
